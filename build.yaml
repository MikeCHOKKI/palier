targets:
  $default:
    builders:
      drift_dev:
        options:
          # Dates en texte ISO 8601 avec fuseau : lisibles, triables, et prêtes pour
          # une synchronisation future (phase 2) sans perte des millisecondes.
          store_date_time_values_as_text: true
          # Instantané de chaque version du schéma (drift_schemas/) et tests de
          # migration générés (test/drift/) : `dart run drift_dev make-migrations`
          # après chaque changement de version.
          databases:
            palier: lib/data/database.dart
