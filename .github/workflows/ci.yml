name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    name: Format, analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Version figée, la même que sur le poste : 3.50 rend material.dart
          # obsolète (au profit de material_ui), et une CI qui change de Flutter
          # d'elle-même échoue sans que le code ait bougé.
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Dépendances (génère aussi les textes de l'interface)
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test
