name: palier
description: "Palier : suivre ses dépenses, son sport et ses habitudes, en famille et hors ligne."
publish_to: 'none'
repository: https://github.com/MikeCHOKKI/palier
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Socle partagé : thème, widgets, stockage (https://pub.dev/packages/lucid_core_flutter).
  lucid_core_flutter: ^0.9.0

  # Composants Material, sortis du SDK depuis Flutter 3.50 : le socle s'en sert
  # déjà, et ses types (ThemeData…) doivent être les mêmes des deux côtés.
  material_ui: ^1.11.0

  # État et navigation.
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3

  # Données locales (SQLite).
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  uuid: ^4.6.0

  # Sécurité : verrou par code, empreinte, export chiffré.
  cryptography: ^2.9.0
  local_auth: ^3.0.2

  # Fichiers d'export et d'import.
  file_picker: ^13.3.2

  intl: ^0.20.3

  # Réglages d'affichage propres au téléphone (déjà tiré par lucid_core_flutter).
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/licenses/

  fonts:
    # Titres et logotype (OFL). Fichiers statiques : une graisse par fichier.
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-SemiBold.ttf
          weight: 600
    # Texte (OFL). Police variable : la graisse passe par FontVariation (voir palier_theme.dart).
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
